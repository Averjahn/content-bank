<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Банк контента платформы</title>
<meta name="description" content="Все клинические тренажёры и курсы платформы: поиск по нозологии, объём кейсов, связь с курсами, кейсы вне курсов.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>

<header class="top">
  <div class="top__row">
    <div class="brand">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l1.5-5 3 10 2-8 1.5 3H21"/></svg>
      </span>
      <span>
        <span class="brand__name">Банк контента</span>
        <span class="brand__sub" id="stamp">загрузка…</span>
      </span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="overview" role="tab">Обзор</button>
      <button class="tab" data-view="trainers" role="tab">Тренажёры</button>
      <button class="tab" data-view="courses" role="tab">Курсы</button>
      <button class="tab" data-view="coverage" role="tab">Покрытие программы</button>
      <button class="tab" data-view="modules" role="tab">Модули</button>
    </nav>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск: нозология, название, id" autocomplete="off" aria-label="Поиск по банку">
    </label>

    <a class="dl-all" href="data/bank-dump.zip" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>Скачать всё</span>
    </a>

    <button class="icon-btn" id="theme" aria-label="Переключить тему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- ────── ОБЗОР ────── -->
  <section class="view" id="view-overview">
    <div class="tiles" id="tiles"></div>

    <div class="card">
      <div class="card__head">
        <h2>Семейства кейсов</h2>
        <span>только рабочие · клик открывает список</span>
      </div>
      <div class="card__body"><div class="bars" id="families"></div></div>
    </div>

    <div class="card">
      <div class="card__head">
        <h2>Что стоит посмотреть</h2>
        <span>замечания по банку</span>
      </div>
      <div class="card__body"><div class="bars" id="notes"></div></div>
    </div>
  </section>

  <!-- ────── ТРЕНАЖЁРЫ ────── -->
  <section class="view" id="view-trainers" hidden>
    <div class="filters" id="filters">
      <button class="chip is-on" data-f="live">Только рабочие</button>
      <button class="chip" data-f="orphan">Вне курсов</button>
      <div class="filters__sep"></div>
      <button class="chip" data-f="tech2">tech2</button>
      <button class="chip" data-f="dev2">dev2</button>
      <div class="filters__sep"></div>
      <select class="chip" id="famSel"><option value="">Все семейства</option></select>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="id">Кейс</th>
            <th data-sort="name">Название</th>
            <th class="topic" data-sort="topic">Тема / нозология</th>
            <th class="plot">Краткое описание</th>
            <th class="family" data-sort="family">Семейство</th>
            <th data-sort="steps" class="n">Шагов</th>
            <th data-sort="courses" class="n">Курсы, id</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="more" id="more" hidden>Показать ещё</button>
    </div>
  </section>

  <!-- ────── ПОКРЫТИЕ ПРОГРАММЫ ────── -->
  <section class="view" id="view-coverage" hidden>
    <p class="view-note" id="progNote"></p>
    <div class="tiles" id="covTiles"></div>
    <div class="filters">
      <select class="chip" id="progSel"></select>
      <button class="chip" data-cov="gaps">Только дыры</button>
      <select class="chip" id="blockSel"><option value="">Все блоки</option></select>
      <span class="count" id="covCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Блок</th>
            <th>Тема программы</th>
            <th class="topic">Тематика</th>
            <th class="family">Уровень</th>
            <th class="n">Нужно</th>
            <th class="n">Найдено</th>
            <th>Кейсы из банка</th>
          </tr>
        </thead>
        <tbody id="covRows"></tbody>
      </table>
    </div>
  </section>

  <!-- ────── МОДУЛИ ────── -->
  <section class="view" id="view-modules" hidden>
    <figure class="arch">
      <figcaption class="arch__cap">
        <b>Как модуль подключается к платформе.</b> Модуль живёт в своих файлах и владеет своими
        данными. Ядро меняется ровно в одном месте — там, где модуль регистрируется. К чужим
        данным модуль ходит только через их API, а включается флагом.
      </figcaption>
      <svg viewBox="0 0 1000 470" role="img" xmlns="http://www.w3.org/2000/svg"
           aria-label="Слева три вида модулей: домен бэкенда, экран или тип шага курса, стадия конвейера. Каждый соединяется с ядром платформы одной точкой подключения: строкой регистрации в app.go, пунктом меню с маршрутом, файлом на входе стадии. Справа ядро — роутер, оболочка кабинета и каталог прогона. Отдельно показано, что к чужому домену модуль обращается только через его API и не пишет в него.">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
            <path d="M0 0 L9 3.5 L0 7 z" fill="currentColor"/>
          </marker>
          <marker id="ah-acc" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
            <path d="M0 0 L9 3.5 L0 7 z" style="fill:var(--accent)"/>
          </marker>
        </defs>

        <text x="24" y="28" font-size="13" font-weight="600" fill="currentColor" opacity=".5">МОДУЛЬ</text>
        <text x="368" y="28" font-size="13" font-weight="600" style="fill:var(--accent)">ТОЧКА ПОДКЛЮЧЕНИЯ</text>

        <!-- ядро одной панелью: модули втыкаются именно в него -->
        <rect x="620" y="44" width="360" height="330" rx="16"
              style="fill:var(--accent-soft); stroke:var(--accent-line)" stroke-width="1.5"/>
        <text x="644" y="76" font-size="15" font-weight="700" style="fill:var(--accent-ink, var(--accent))">Ядро платформы</text>
        <text x="644" y="98" font-size="12.5" fill="currentColor" opacity=".6">общее для всех модулей</text>

        <rect x="644" y="118" width="312" height="66" rx="10" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="664" y="146" font-size="15" font-weight="600" fill="currentColor">Роутер /api/v1</text>
        <text x="664" y="168" font-size="12.5" fill="currentColor" opacity=".62">авторизация, права, middleware</text>

        <rect x="644" y="196" width="312" height="66" rx="10" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="664" y="224" font-size="15" font-weight="600" fill="currentColor">Оболочка кабинета</text>
        <text x="664" y="246" font-size="12.5" fill="currentColor" opacity=".62">роли, навигация, курс, отчёты</text>

        <rect x="644" y="274" width="312" height="66" rx="10" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="664" y="302" font-size="15" font-weight="600" fill="currentColor">Каталог прогона out/</text>
        <text x="664" y="324" font-size="12.5" fill="currentColor" opacity=".62">его читает следующая стадия</text>

        <!-- бэкенд -->
        <rect x="24" y="118" width="286" height="66" rx="10" style="fill:var(--surface-2); stroke:var(--line-strong)"/>
        <text x="44" y="146" font-size="15" font-weight="600" fill="currentColor">Домен бэкенда</text>
        <text x="44" y="168" font-size="12.5" fill="currentColor" opacity=".62">свои таблицы, роуты и права</text>
        <line x1="310" y1="151" x2="636" y2="151" style="stroke:var(--accent)" stroke-width="1.8" marker-end="url(#ah-acc)"/>
        <rect x="356" y="134" width="222" height="26" rx="7" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="467" y="152" font-size="13" text-anchor="middle" style="fill:var(--accent)">одна строка в app.go</text>

        <!-- фронтенд -->
        <rect x="24" y="196" width="286" height="66" rx="10" style="fill:var(--surface-2); stroke:var(--line-strong)"/>
        <text x="44" y="224" font-size="15" font-weight="600" fill="currentColor">Экран или тип шага курса</text>
        <text x="44" y="246" font-size="12.5" fill="currentColor" opacity=".62">свой компонент и свои стили</text>
        <line x1="310" y1="229" x2="636" y2="229" style="stroke:var(--accent)" stroke-width="1.8" marker-end="url(#ah-acc)"/>
        <rect x="356" y="212" width="222" height="26" rx="7" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="467" y="230" font-size="13" text-anchor="middle" style="fill:var(--accent)">пункт меню и маршрут</text>

        <!-- конвейер -->
        <rect x="24" y="274" width="286" height="66" rx="10" style="fill:var(--surface-2); stroke:var(--line-strong)"/>
        <text x="44" y="302" font-size="15" font-weight="600" fill="currentColor">Стадия конвейера</text>
        <text x="44" y="324" font-size="12.5" fill="currentColor" opacity=".62">результат воспроизводим</text>
        <line x1="310" y1="307" x2="636" y2="307" style="stroke:var(--accent)" stroke-width="1.8" marker-end="url(#ah-acc)"/>
        <rect x="356" y="290" width="222" height="26" rx="7" style="fill:var(--surface); stroke:var(--accent-line)"/>
        <text x="467" y="308" font-size="13" text-anchor="middle" style="fill:var(--accent)">файл на входе и на выходе</text>

        <!-- правило про чужие данные -->
        <rect x="770" y="404" width="186" height="48" rx="10" fill="none" stroke="currentColor"
              stroke-opacity=".3" stroke-dasharray="6 5"/>
        <text x="863" y="434" font-size="13.5" text-anchor="middle" fill="currentColor" opacity=".62">чужой домен</text>
        <path d="M167 340 L167 428 L760 428" fill="none" stroke="currentColor" stroke-opacity=".45"
              stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
        <text x="455" y="418" font-size="13" text-anchor="middle" fill="currentColor" opacity=".62">только чтение и только через его API</text>
      </svg>
    </figure>

    <div class="tiles" id="modTiles"></div>
    <div class="mods" id="modList"></div>
  </section>

  <!-- ────── КУРСЫ ────── -->
  <section class="view" id="view-courses" hidden>
    <div class="filters">
      <button class="chip is-on" data-c="nonempty">С тренажёрами</button>
      <button class="chip" data-c="adaptive">Адаптивные</button>
      <span class="count" id="ccount"></span>
    </div>
    <div class="courses" id="courseList"></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-live="polite"></aside>

<script src="app.js?v=6"></script>
</body>
</html>
