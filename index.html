<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Банк контента платформы</title>
<meta name="description" content="Все клинические тренажёры и курсы платформы: поиск по нозологии, объём кейсов, связь с курсами, кейсы вне курсов.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<header class="top">
  <div class="top__row">
    <div class="brand">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l1.5-5 3 10 2-8 1.5 3H21"/></svg>
      </span>
      <span>
        <span class="brand__name">Банк контента</span>
        <span class="brand__sub" id="stamp">загрузка…</span>
      </span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="overview" role="tab">Обзор</button>
      <button class="tab" data-view="trainers" role="tab">Тренажёры</button>
      <button class="tab" data-view="courses" role="tab">Курсы</button>
      <button class="tab" data-view="coverage" role="tab">Покрытие программы</button>
      <button class="tab" data-view="modules" role="tab">Модули</button>
    </nav>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск: нозология, название, id" autocomplete="off" aria-label="Поиск по банку">
    </label>

    <a class="dl-all" href="data/bank-dump.zip" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>Скачать всё</span>
    </a>

    <button class="icon-btn" id="theme" aria-label="Переключить тему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- ────── ОБЗОР ────── -->
  <section class="view" id="view-overview">
    <div class="tiles" id="tiles"></div>

    <div class="card">
      <div class="card__head">
        <h2>Семейства кейсов</h2>
        <span>только рабочие · клик открывает список</span>
      </div>
      <div class="card__body"><div class="bars" id="families"></div></div>
    </div>

    <div class="card">
      <div class="card__head">
        <h2>Что стоит посмотреть</h2>
        <span>замечания по банку</span>
      </div>
      <div class="card__body"><div class="bars" id="notes"></div></div>
    </div>
  </section>

  <!-- ────── ТРЕНАЖЁРЫ ────── -->
  <section class="view" id="view-trainers" hidden>
    <div class="filters" id="filters">
      <button class="chip is-on" data-f="live">Только рабочие</button>
      <button class="chip" data-f="orphan">Вне курсов</button>
      <div class="filters__sep"></div>
      <button class="chip" data-f="tech2">tech2</button>
      <button class="chip" data-f="dev2">dev2</button>
      <div class="filters__sep"></div>
      <select class="chip" id="famSel"><option value="">Все семейства</option></select>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="id">Кейс</th>
            <th data-sort="name">Название</th>
            <th class="topic" data-sort="topic">Тема / нозология</th>
            <th class="family" data-sort="family">Семейство</th>
            <th data-sort="steps" class="n">Шагов</th>
            <th data-sort="courses" class="n">Курсы, id</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="more" id="more" hidden>Показать ещё</button>
    </div>
  </section>

  <!-- ────── ПОКРЫТИЕ ПРОГРАММЫ ────── -->
  <section class="view" id="view-coverage" hidden>
    <div class="tiles" id="covTiles"></div>
    <div class="filters">
      <button class="chip" data-cov="gaps">Только дыры</button>
      <select class="chip" id="blockSel"><option value="">Все блоки</option></select>
      <span class="count" id="covCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Блок</th>
            <th>Тема программы</th>
            <th class="topic">Тематика</th>
            <th class="family">Уровень</th>
            <th class="n">Нужно</th>
            <th class="n">Найдено</th>
            <th>Кейсы из банка</th>
          </tr>
        </thead>
        <tbody id="covRows"></tbody>
      </table>
    </div>
  </section>

  <!-- ────── МОДУЛИ ────── -->
  <section class="view" id="view-modules" hidden>
    <figure class="arch">
      <figcaption class="arch__cap">
        <b>Как модуль подключается к платформе.</b> Модуль живёт в своих файлах и владеет своими
        данными; ядро меняется ровно в одном месте — там, где модуль регистрируется. К чужим
        данным модуль ходит только через их API, а включается флагом.
      </figcaption>
      <svg viewBox="0 0 980 425" role="img" xmlns="http://www.w3.org/2000/svg"
           aria-label="Три слоя платформы. В каждом модуль слева соединяется с ядром справа одной точкой подключения: в бэкенде — строкой регистрации в app.go, во фронтенде — пунктом меню и маршрутом, в конвейере — файлом на входе и выходе. К чужим доменам модуль обращается только через API.">
        <defs>
          <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
            <path d="M0 0 L8 3.2 L0 6.4 z" fill="currentColor"/>
          </marker>
          <marker id="ah-acc" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
            <path d="M0 0 L8 3.2 L0 6.4 z" fill="#0E7490"/>
          </marker>
        </defs>

        <text x="20" y="26" font-size="12" font-weight="600" fill="currentColor" opacity=".55">МОДУЛЬ</text>
        <text x="470" y="26" font-size="12" font-weight="600" fill="#0E7490">ТОЧКА ПОДКЛЮЧЕНИЯ</text>
        <text x="760" y="26" font-size="12" font-weight="600" fill="currentColor" opacity=".55">ЯДРО</text>

        <!-- бэкенд -->
        <rect x="20" y="48" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="36" y="72" font-size="13.5" font-weight="600" fill="currentColor">Домен: entity → repository</text>
        <text x="36" y="92" font-size="13.5" font-weight="600" fill="currentColor">→ controller → api</text>
        <text x="36" y="116" font-size="11.5" fill="currentColor" opacity=".6">свои таблицы, свои роуты, свои права</text>
        <line x1="320" y1="91" x2="452" y2="91" stroke="#0E7490" stroke-width="1.6" marker-end="url(#ah-acc)"/>
        <text x="386" y="78" font-size="11.5" text-anchor="middle" fill="#0E7490">одна строка в app.go</text>
        <rect x="460" y="48" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="476" y="76" font-size="13.5" font-weight="600" fill="currentColor">Роутер /api/v1</text>
        <text x="476" y="100" font-size="11.5" fill="currentColor" opacity=".6">авторизация, права, общие</text>
        <text x="476" y="118" font-size="11.5" fill="currentColor" opacity=".6">middleware</text>

        <!-- фронтенд -->
        <rect x="20" y="168" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="36" y="192" font-size="13.5" font-weight="600" fill="currentColor">Экран раздела или</text>
        <text x="36" y="212" font-size="13.5" font-weight="600" fill="currentColor">новый тип шага курса</text>
        <text x="36" y="236" font-size="11.5" fill="currentColor" opacity=".6">свой компонент и свои стили</text>
        <line x1="320" y1="211" x2="452" y2="211" stroke="#0E7490" stroke-width="1.6" marker-end="url(#ah-acc)"/>
        <text x="386" y="198" font-size="11.5" text-anchor="middle" fill="#0E7490">пункт меню + маршрут</text>
        <rect x="460" y="168" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="476" y="196" font-size="13.5" font-weight="600" fill="currentColor">Оболочка кабинета</text>
        <text x="476" y="220" font-size="11.5" fill="currentColor" opacity=".6">роли, навигация, курс, отчёты</text>

        <!-- конвейер -->
        <rect x="20" y="288" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="36" y="312" font-size="13.5" font-weight="600" fill="currentColor">Стадия конвейера</text>
        <text x="36" y="336" font-size="11.5" fill="currentColor" opacity=".6">без скрытого состояния,</text>
        <text x="36" y="354" font-size="11.5" fill="currentColor" opacity=".6">результат воспроизводим</text>
        <line x1="320" y1="331" x2="452" y2="331" stroke="#0E7490" stroke-width="1.6" marker-end="url(#ah-acc)"/>
        <text x="386" y="318" font-size="11.5" text-anchor="middle" fill="#0E7490">файл → файл</text>
        <rect x="460" y="288" width="300" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="476" y="316" font-size="13.5" font-weight="600" fill="currentColor">Каталог прогона out/</text>
        <text x="476" y="340" font-size="11.5" fill="currentColor" opacity=".6">следующая стадия читает его</text>

        <!-- чужие данные -->
        <rect x="800" y="168" width="160" height="86" rx="10" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="5 4"/>
        <text x="816" y="196" font-size="12.5" font-weight="600" fill="currentColor" opacity=".7">Чужой домен</text>
        <text x="816" y="218" font-size="11" fill="currentColor" opacity=".55">курсы, пользователи,</text>
        <text x="816" y="234" font-size="11" fill="currentColor" opacity=".55">отчёты</text>
        <path d="M170 374 L170 404 L880 404 L880 262" fill="none" stroke="currentColor" stroke-opacity=".45"
              stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
        <text x="525" y="398" font-size="11.5" text-anchor="middle" fill="currentColor" opacity=".6">читать чужое — только через его API, писать нельзя</text>
      </svg>
    </figure>

    <div class="tiles" id="modTiles"></div>
    <div class="mods" id="modList"></div>
  </section>

  <!-- ────── КУРСЫ ────── -->
  <section class="view" id="view-courses" hidden>
    <div class="filters">
      <button class="chip is-on" data-c="nonempty">С тренажёрами</button>
      <button class="chip" data-c="adaptive">Адаптивные</button>
      <span class="count" id="ccount"></span>
    </div>
    <div class="courses" id="courseList"></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-live="polite"></aside>

<script src="app.js?v=6"></script>
</body>
</html>
